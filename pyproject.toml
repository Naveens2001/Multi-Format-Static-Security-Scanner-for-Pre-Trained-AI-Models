[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-scanner"
version = "2.0.0"
description = "Static security scanner for pre-trained AI models (Pickle, PyTorch, SafeTensors, GGUF)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Static Security Scanner Project" },
]
keywords = ["security", "scanner", "machine-learning", "model", "pickle", "safetensors", "gguf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -----------------------------------------------------------------------
# ZERO mandatory runtime dependencies — standard library only.
# -----------------------------------------------------------------------
dependencies = []

[project.scripts]
model-scanner = "model_scanner.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
report = [
    "weasyprint>=60.0",
]
onnx = ["onnx>=1.14"]
keras = ["h5py>=3.0"]
tensorflow = ["protobuf>=4.0"]
p2 = ["onnx>=1.14", "h5py>=3.0", "protobuf>=4.0"]

# -----------------------------------------------------------------------
# Setuptools: src layout
# -----------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-o", "tmp_path_retention_policy=none",
    "-o", "tmp_path_retention_count=0",
]
markers = [
    "unit: unit tests",
    "integration: end-to-end integration tests",
    "robustness: robustness and fuzz tests",
    "safety: zero-dynamic-execution verification tests",
]

# -----------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------
[tool.coverage.run]
source = ["model_scanner"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

# -----------------------------------------------------------------------
# ruff
# -----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",    # Use of assert — allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"src/model_scanner/__main__.py" = ["ANN201", "ANN001"]
"src/model_scanner/presentation/html_report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["model_scanner"]

# -----------------------------------------------------------------------
# mypy — strict
# -----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
